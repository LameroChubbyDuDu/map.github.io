<!DOCTYPE html>
<html>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap');

    html {
        list-style-type: none;
    }

    body {
        align-items: center;
        justify-content: center;
        text-align: center;
        /* background-image: url("img/bus-stop.PNG"); */
        position: relative;
        background-size: contain;
        background-repeat: no-repeat;
        width: 100vw;
        height: 100vh;
    }

    .map{
        width: 100vh;
        height: 100vh;
        background-image: url("img/cuisine.png");
        background-size: contain;
        background-repeat: no-repeat;
    }

    .avatar {
        background-image: url("img/girl-front-1.png");
        background-size: contain;
        background-repeat: no-repeat;
        width: 200px;
        height: 200px;
        position: absolute;
        top: 0px;
        left: 0px;
        animation: walk-front 1s linear forwards;
    }
    
    .popUp{
        width: 200px;
        height: 50px;
        text-align: center;
        background-color: rgb(255, 242, 227);
        color: black;
        position: absolute;
        top: 200px;
        left: 200px;
    }

    @keyframes walk-front{
        0% {background-image: url("img/girl-front-1.png");}
        50% {background-image: url("img/girl-front-2.png");}
        100% {background-image: url("img/girl-front-3.png");}
    }

    @keyframes walk-left{
        0% {background-image: url("img/girl-left-1.png");}
        50% {background-image: url("img/girl-left-2.png");}
        100% {background-image: url("img/girl-left-3.png");}
    }

    @keyframes walk-right{
        0% {background-image: url("img/girl-right-1.png");}
        50% {background-image: url("img/girl-right-2.png");}
        100% {background-image: url("img/girl-right-3.png");}
    }

    @keyframes walk-back{
        0% {background-image: url("img/girl-back-1.png");}
        50% {background-image: url("img/girl-back-2.png");}
        100% {background-image: url("img/girl-back-3.png");}
    }
</style>

<body>
    <div class="map">
        <!-- <div class="navigate"></div> -->
         <h3 class="popUp" style="display: none;">這是麵店!</h3>
        <div class="avatar"></div>
    </div>
    
</body>

<script>
    const avatar = document.getElementsByClassName('avatar')[0];
    const popUp = document.getElementsByClassName('popUp')[0];

    document.addEventListener('keydown', (event) => {
        const key = event.key;

        const avatarStyle = window.getComputedStyle(avatar);
        const left = avatarStyle.left;
        const top = avatarStyle.top;

        const maxWidth = window.innerWidth;
        const maxHeight = window.innerHeight;
        console.log(left, top);
        console.log("Max dimensions:", maxWidth, maxHeight);
        console.log("Avatar offsets:", avatar.offsetLeft, avatar.offsetTop);
        console.log("keyDown: ", key);

        if (key === "ArrowLeft") {
            if (avatar.offsetLeft == 0) {
                avatar.style.backgroundImage = "url('img/girl-left-1.png')";
                return;
            } else {
                avatar.style.left = (avatar.offsetLeft - 50) + "px";
                avatar.style.animationName = "walk-left";
            }
            const isTeleport = teleport(avatar.offsetLeft, avatar.offsetTop);
            if(isTeleport){window.location.replace("/");}

            const isCollide = collidePopUp(avatar.offsetLeft, avatar.offsetTop);
            if(isCollide){
                console.log("Collided with pop-up!");
                popUp.setAttribute("style", "display: ''");
            }else{
                popUp.setAttribute("style", "display: none");}

        } else if (key === "ArrowRight") {
            if (avatar.offsetLeft + avatar.offsetWidth + 50 > maxHeight) {
                console.log("Reached the right edge of the screen.");
                avatar.style.backgroundImage = "url('img/girl-right-1.png')";
                return;
            } else {
                avatar.style.left = (avatar.offsetLeft + 50) + "px";
                avatar.style.animationName = "walk-right";
            }
            const isCollide = collidePopUp(avatar.offsetLeft, avatar.offsetTop);
            if(isCollide){
                console.log("Collided with pop-up!");
                popUp.setAttribute("style", "display: ''");
            }else{
                popUp.setAttribute("style", "display: none");}
        } else if (key === "ArrowUp") {
            if (avatar.offsetTop == 0) {
                avatar.style.backgroundImage = "url('img/girl-back-1.png')";
                return;
            } else {
                avatar.style.top = (avatar.offsetTop - 50) + "px";
                avatar.style.animationName = "walk-back";
            }
            const isCollide = collidePopUp(avatar.offsetLeft, avatar.offsetTop);
            if(isCollide){
                console.log("Collided with pop-up!");
                popUp.setAttribute("style", "display: ''");
            }else{
                popUp.setAttribute("style", "display: none");}
        } else if (key === "ArrowDown") {
            if (avatar.offsetTop + avatar.offsetHeight + 50 > maxHeight) {
                console.log("Reached the bottom edge of the screen.");
                avatar.style.backgroundImage = "url('img/girl-front-1.png')";
                return;
            } else {
                avatar.style.top = (avatar.offsetTop + 50) + "px";
                avatar.style.animationName = "walk-front";
            }
            const isTeleport = teleport(avatar.offsetLeft, avatar.offsetTop);
            if(isTeleport){window.location.replace("/");}
            const isCollide = collidePopUp(avatar.offsetLeft, avatar.offsetTop);
            if(isCollide){
                console.log("Collided with pop-up!");
                popUp.setAttribute("style", "display: ''");
            }else{
                popUp.setAttribute("style", "display: none");}
        }
    });

    function teleport(left, top){
        if(left == 0 && top == 0){return true;}
        else {return false;}
    }

    function collidePopUp(left, top){
        if(left == 250 && top == 250){return true;}
        else {return false;}
    }
</script>

</html>
